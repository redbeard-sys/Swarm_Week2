LAB_DESCRIPTION="Week 2: the pheromone shim (EtherType 0x88B5) across P4 switches and an XDP router"
LAB_VERSION=1.0

#  h1 --A-- s1 --B-- s2 --C-- r1 --D-- s3 --E-- h2
#           P4       P4      XDP       P4
#  links B, C, D are fabric (shim on, MTU 1508); A and E are host links (no shim).

h1[0]="A"
h1[image]="kathara-shim"

s1[0]="A"
s1[1]="B"
s1[image]="kathara/p4"

s2[0]="B"
s2[1]="C"
s2[image]="kathara/p4"

r1[0]="C"
r1[1]="D"
r1[image]="kathara-shim"
r1[sysctl]="net.ipv4.ip_forward=1"

s3[0]="D"
s3[1]="E"
s3[image]="kathara/p4"

h2[0]="E"
h2[image]="kathara-shim"
